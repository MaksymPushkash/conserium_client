<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cortex Clipper</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>Cortex</h1>
      <label>
        API origin
        <input id="apiOrigin" placeholder="https://api.cortexx.me/api/v1" />
      </label>
      <label>
        API key
        <input id="apiKey" type="password" placeholder="ctx_..." />
      </label>
      <label>
        Collection id
        <input id="collectionId" placeholder="optional" />
      </label>
      <label>
        Tags
        <input id="tags" placeholder="research,reading" />
      </label>
      <div class="actions">
        <button id="savePage">Save page</button>
        <button id="saveSelection">Save selection</button>
      </div>
      <p id="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
